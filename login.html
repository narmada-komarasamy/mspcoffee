<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hill Tiller Coffee Roasters — Sign In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
    }

    /* ── Video background ── */
    #bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.55) saturate(1.2);
    }

    /* ── Dark gradient overlay so text stays legible ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(0,0,0,0.55) 0%,
        rgba(10,8,5,0.45) 50%,
        rgba(0,0,0,0.65) 100%
      );
      z-index: 1;
    }

    /* ── Login card ── */
    .card-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(10, 8, 5, 0.72);
      border: 1px solid rgba(197, 156, 77, 0.35);
      border-radius: 4px;
      padding: 2.8rem 2.4rem 2.4rem;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 0 0 1px rgba(197,156,77,0.08),
        0 24px 64px rgba(0,0,0,0.6);
    }

    /* ── Logo / brand ── */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-badge {
      display: inline-block;
      border: 1.5px solid #c59c4d;
      border-radius: 2px;
      padding: 0.18rem 0.7rem;
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      color: #c59c4d;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }

    .brand h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: #c59c4d;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1;
    }

    .brand h2 {
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      color: #9e8060;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    .brand-sub {
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      color: #6b5a3e;
      text-transform: uppercase;
      margin-top: 0.15rem;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.6rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(197,156,77,0.25);
    }
    .divider span {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: #6b5a3e;
      text-transform: uppercase;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      color: #9e8060;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(197,156,77,0.25);
      border-radius: 2px;
      color: #e8d8b8;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input::placeholder { color: rgba(158,128,96,0.5); }

    input:focus {
      border-color: rgba(197,156,77,0.6);
      background: rgba(255,255,255,0.07);
    }

    .forgot {
      display: block;
      text-align: right;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: #9e8060;
      text-decoration: none;
      margin-top: 0.35rem;
      transition: color 0.2s;
    }
    .forgot:hover { color: #c59c4d; }

    .btn-signin {
      width: 100%;
      margin-top: 1.4rem;
      padding: 0.85rem;
      background: #c59c4d;
      color: #0a0804;
      border: none;
      border-radius: 2px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-signin:hover { background: #d4aa5a; }
    .btn-signin:active { transform: scale(0.99); }

    .footer-note {
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.62rem;
      color: #5a4a30;
      letter-spacing: 0.08em;
    }

    .footer-note a {
      color: #9e8060;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-note a:hover { color: #c59c4d; }

    /* ── Tagline bottom ── */
    .tagline {
      position: fixed;
      bottom: 1.5rem;
      left: 0; right: 0;
      text-align: center;
      z-index: 2;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      color: rgba(197,156,77,0.5);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Background video (looping, muted, autoplay) -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="background_merged.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>

  <div class="card-wrap">
    <div class="card">

      <!-- Brand header -->
      <div class="brand">
        <div class="brand-badge">Est. Since</div>
        <h1>Hill Tiller</h1>
        <h2>Coffee Roasters</h2>
        <div class="brand-sub">by MSP Coffee</div>
      </div>

      <div class="divider"><span>Sign In</span></div>

      <!-- Login form -->
      <form onsubmit="return false;">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@mspcoffee.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
          <a href="#" class="forgot">Forgot password?</a>
        </div>

        <button class="btn-signin" type="submit">Sign In</button>
      </form>

      <p class="footer-note">
        Don't have an account? <a href="#">Request access</a>
      </p>

    </div>
  </div>

  <div class="tagline">Perfection that only a century of coffee farming can deliver.</div>

</body>
</html>
